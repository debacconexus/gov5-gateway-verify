<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gov5 Gateway Console | DeBacco Nexus</title>
<link rel="icon" href="/dn-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rubik:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F8F8; --panel:#FFFFFF; --panel2:#EEF4F5; --line:#D7E2E4; --text:#0E1A1C; --muted:#5A6B72; --faint:#8A9BA1;
  --teal:#0C8A96; --zircon:#4CD8E0; --tealSoft:#E3F4F5; --ok:#1F8A4C; --okSoft:#E2F3E9; --warn:#9A6400; --warnSoft:#FBF0DA;
  --bad:#B4332B; --badSoft:#FBE5E3; --onTeal:#FFFFFF;
  --lhNote:#D400B8; --lhNoteGlow:rgba(212,0,184,.45); --lhHeld:#FFC400; --lhHeldGlow:rgba(255,196,0,.5); --lhWatch:#FF7A00; --lhWatchGlow:rgba(255,122,0,.4); --lhStop:#FF2D20; --lhStopGlow:rgba(255,45,32,.4); --lhOk:#00B85C; --lhWork:#18C964; --lhWorkGlow:rgba(24,201,100,.55); --lhLive:#FFFFFF; --shadow:0 1px 2px rgba(14,26,28,.06),0 4px 16px rgba(14,26,28,.05); color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1416; --panel:#111D20; --panel2:#16252A; --line:#24363B; --text:#E7F1F2; --muted:#9DB3B8; --faint:#6E8790;
  --teal:#3FC3CE; --zircon:#4CD8E0; --tealSoft:#123236; --ok:#4CC27F; --okSoft:#12301F; --warn:#E8B04B; --warnSoft:#33280F;
  --bad:#F07A70; --badSoft:#3A1A17; --onTeal:#062023; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
  --lhNote:#FF4FD8; --lhNoteGlow:rgba(255,79,216,.5); --lhHeld:#FFD60A; --lhHeldGlow:rgba(255,214,10,.55); --lhWatch:#FF8A1F; --lhWatchGlow:rgba(255,138,31,.45); --lhStop:#FF453A; --lhStopGlow:rgba(255,69,58,.5); --lhOk:#30D158; --lhWork:#30D158; --lhWorkGlow:rgba(48,209,88,.6); --lhLive:#FFFFFF}}
:root[data-theme="dark"]{
  --bg:#0B1416; --panel:#111D20; --panel2:#16252A; --line:#24363B; --text:#E7F1F2; --muted:#9DB3B8; --faint:#6E8790;
  --teal:#3FC3CE; --zircon:#4CD8E0; --tealSoft:#123236; --ok:#4CC27F; --okSoft:#12301F; --warn:#E8B04B; --warnSoft:#33280F;
  --bad:#F07A70; --badSoft:#3A1A17; --onTeal:#062023; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
  --lhNote:#FF4FD8; --lhNoteGlow:rgba(255,79,216,.5); --lhHeld:#FFD60A; --lhHeldGlow:rgba(255,214,10,.55); --lhWatch:#FF8A1F; --lhWatchGlow:rgba(255,138,31,.45); --lhStop:#FF453A; --lhStopGlow:rgba(255,69,58,.5); --lhOk:#30D158; --lhWork:#30D158; --lhWorkGlow:rgba(48,209,88,.6); --lhLive:#FFFFFF}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--teal)}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12.5px}
/* top bar */
.top{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;
  padding:10px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left))}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);min-width:0;flex:none}
.brand img{width:38px;height:38px}
.brand .name{font-family:Rubik,Inter,sans-serif;font-weight:700;font-size:18px;line-height:1.1;white-space:nowrap}
.brand .tag{font-size:11.5px;color:var(--teal);font-weight:600;letter-spacing:.02em;white-space:nowrap}
.g5{color:var(--teal)}
.brand .tag.by{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.lockup{display:flex;align-items:center;justify-content:center;gap:14px;margin:0 auto 20px}
.lockup img{width:64px;height:64px;flex:none}
.lockup .ln{font-family:Rubik,Inter,sans-serif;font-weight:800;font-size:30px;line-height:1;letter-spacing:-.02em;color:var(--text);white-space:nowrap}
.lockup .lt{font-size:13.5px;color:var(--muted);margin-top:6px}
.lockup .lb{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);font-weight:600;margin-top:4px}
.sep{width:1px;height:28px;background:var(--line)}
.product{font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.theme{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.theme button{border:0;background:transparent;padding:5px 10px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.theme button.on{background:var(--teal);color:var(--onTeal)}
select.cust{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 8px;max-width:220px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;font-weight:600;cursor:pointer}
a.btn{text-decoration:none;color:var(--text);display:inline-block}
.btn:hover{border-color:var(--teal)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--onTeal)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* layout */
.shell{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 60px)}
nav{border-right:1px solid var(--line);padding:16px 10px;background:var(--panel)}
nav .lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:0 10px 8px}
nav button{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:transparent;text-align:left;padding:9px 12px;border-radius:8px;font-weight:600;color:var(--muted);cursor:pointer}
nav button:hover{background:var(--panel2);color:var(--text)}
nav button.on{background:var(--tealSoft);color:var(--teal)}
nav .count{background:var(--warn);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px}
main{padding:24px max(16px,env(safe-area-inset-right)) 48px 24px;min-width:0}
h1{font-size:22px;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 20px;max-width:70ch}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.card .n{font-size:26px;font-weight:700;letter-spacing:-.01em}
.card .k{font-size:12px;color:var(--muted);font-weight:600}
.card.teal{border-top:3px solid var(--teal)} .card.ok{border-top:3px solid var(--ok)} .card.bad{border-top:3px solid var(--bad)} .card.warn{border-top:3px solid var(--warn)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);margin-bottom:16px;min-width:0}
.panel h2{font-size:15px;margin:0;padding:14px 16px;border-bottom:1px solid var(--line)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
td select{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 8px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:700;white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--panel2)}
.v{display:inline-block;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.v.CERTIFIED,.v.GO,.v.approved{background:var(--okSoft);color:var(--ok)}
.v.NO,.v.denied,.v.PROVIDER_ERROR,.v.GATE_ERROR{background:var(--badSoft);color:var(--bad)}
.v.WAIT,.v.pending{background:var(--warnSoft);color:var(--warn)}
.v.other{background:var(--panel2);color:var(--muted)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:12px;margin:2px 4px 2px 0;background:var(--panel2)}
.empty{padding:28px 16px;color:var(--muted);text-align:center}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.toolbar input,.toolbar select{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 10px}
.toolbar input{flex:1;min-width:180px}
/* holds */
.hold{padding:16px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.hold:last-child{border-bottom:0}
.hold .head{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.prompt{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;white-space:pre-wrap;word-break:break-word;max-height:240px;overflow:auto}
.locked{color:var(--muted);font-size:13px;font-style:italic}
.decide{display:grid;grid-template-columns:1fr 2fr auto auto;gap:8px}
.decide input{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 10px;min-width:0}
/* people in charge */
.people{border-top:3px solid var(--teal)}
.people .trade{margin:14px 16px 0;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);font-size:15px;line-height:1.45}
/* savings */
.savings{border-top:3px solid var(--ok)}
.savings .cards{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.savings .big{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;padding:16px}
.savings .big .n{font-size:34px;font-weight:800;letter-spacing:-.02em;color:var(--ok)}
.savings .big .k{font-size:12.5px;color:var(--muted);font-weight:600}
/* return on investment meter */
.roi{margin:0 16px 16px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);display:grid;gap:8px}
.roi .row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.roi .k{font-size:12.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.roi .v{font-size:26px;font-weight:800;letter-spacing:-.02em} .roi .v.ok{color:var(--ok)} .roi .v.warn{color:var(--warn)} .roi .v.low{color:var(--text)}
.roi .gauge{position:relative;height:16px;border-radius:999px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
.roi .gauge i{display:block;height:100%;border-radius:999px;background:var(--teal)} .roi .gauge i.ok{background:var(--ok)} .roi .gauge i.warn{background:var(--warn)}
/* agents */
.tree{list-style:none;margin:0;padding:0}
.tree .tree{padding-left:22px;border-left:2px solid var(--line);margin-left:10px}
.node{padding:12px 16px;border-bottom:1px solid var(--line);display:grid;gap:6px}
.node .head{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.node .who{font-weight:700}
.v.active{background:var(--okSoft);color:var(--ok)} .v.revoked,.v.expired{background:var(--badSoft);color:var(--bad)}
/* limits */
.meter{height:10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok)} .meter.warn i{background:var(--warn)} .meter.bad i{background:var(--bad)}
.alert{margin:0 0 16px;border:1px solid var(--warn);background:var(--warnSoft);color:var(--text);border-radius:10px;padding:12px 14px;font-weight:600}
.alert.bad{border-color:var(--bad);background:var(--badSoft)}
.form .hint{font-weight:400;color:var(--faint);font-size:11.5px}
/* drawer */
.drawer{position:fixed;inset:0;background:rgba(5,12,14,.45);display:flex;justify-content:flex-end;z-index:20}
.drawer .in{width:min(720px,100%);height:100%;overflow:auto;background:var(--bg);border-left:1px solid var(--line);
  padding:20px max(16px,env(safe-area-inset-right)) 40px 20px}
.verify{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
.lh{padding:14px 16px 16px}
.lh .legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.lh .legend button{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;cursor:pointer;color:var(--text)}
.lh .legend button.off{opacity:.45}
.lh .sky{position:relative;display:grid;grid-template-columns:repeat(auto-fill,minmax(18px,1fr));gap:6px;max-width:100%}
.lh .dot{width:18px;height:18px;border-radius:50%;border:0;padding:0;cursor:pointer}
.lh .dot:focus-visible{outline:2px solid var(--text);outline-offset:2px}





.sw{width:12px;height:12px;border-radius:50%;display:inline-block}
.dot.quiet,.sw.quiet{background:var(--lhWork)}
@keyframes lhblink{0%,100%{opacity:1;box-shadow:0 0 0 2px var(--lhWorkGlow),0 0 10px var(--lhWork)}50%{opacity:.35;box-shadow:none}}
.lh .dot.quiet{opacity:.5}
.lh .dot.quiet.acting,.lh .dot.trusted.acting{opacity:1;animation:lhblink var(--bt,2.2s) ease-in-out infinite;animation-delay:var(--bd,0s)}
@keyframes lhheld{0%,100%{box-shadow:0 0 0 3px var(--lhHeldGlow),0 0 16px var(--lhHeld)}50%{box-shadow:0 0 0 6px var(--lhHeldGlow),0 0 24px var(--lhHeld)}}
.lh .dot.held{animation:lhheld 1.6s ease-in-out infinite}
.dot.trusted,.sw.trusted{background:var(--lhOk);box-shadow:0 0 8px var(--lhOk)}
.dot.watch,.sw.watch{background:var(--lhWatch);box-shadow:0 0 0 3px var(--lhWatchGlow),0 0 12px var(--lhWatch)}
.dot.held,.sw.held{background:var(--lhHeld);box-shadow:0 0 0 3px var(--lhHeldGlow),0 0 14px var(--lhHeld)}
.dot.stopped,.sw.stopped{background:var(--lhStop);box-shadow:0 0 0 3px var(--lhStopGlow)}
.btn.revoke-all{letter-spacing:.03em;font-size:12.5px;white-space:nowrap}
.btn.revoke-all.armed{background:var(--text);border-color:var(--bad);color:var(--bg);box-shadow:0 0 0 3px var(--badSoft)}
.lh .recon{font-family:Rubik,Inter,sans-serif;margin:0 0 12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.lh .recon .big{font-size:22px;font-weight:700;letter-spacing:.01em}
.lh .recon .row{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:4px;font-size:15px;font-weight:600}
.lh .recon .row span{display:inline-flex;align-items:center;gap:7px}
.lh .recon .work{margin-top:6px;font-size:15px;color:var(--text)}
.lh .recon .work b{font-size:18px;color:var(--lhOk)}




@keyframes lhnote{0%,100%{box-shadow:0 0 0 0 var(--lhNote)}50%{box-shadow:0 0 0 6px var(--lhNoteGlow),0 0 18px var(--lhNote)}}
.lh .dot.noted{outline:3px solid var(--lhNote);outline-offset:2px;animation:lhnote 1s ease-in-out infinite}
.lh svg.lhlinks{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.lh svg.lhlinks line{stroke:var(--lhNote);stroke-width:3;stroke-linecap:round;stroke-dasharray:7 6;animation:lhdash .9s linear infinite;opacity:.9}
@keyframes lhdash{to{stroke-dashoffset:-26}}
.sw.note{background:var(--lhNote);box-shadow:0 0 0 3px var(--lhNoteGlow)}
@keyframes lhlin{0%,100%{box-shadow:0 0 0 0 var(--lhStop)}50%{box-shadow:0 0 0 6px var(--lhStopGlow),0 0 18px var(--lhStop)}}
.lh .dot.lineage{animation:lhlin 1.1s ease-in-out infinite;outline:3px solid var(--lhStop);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.lh .dot.lineage,.lh .dot.quiet,.lh .dot.held,.lh .dot.noted,.lh svg.lhlinks line{animation:none}}
.oshicap{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--text);color:var(--bg);font-size:17px;line-height:1.45;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px;align-items:baseline}
.oshicap b{color:var(--zircon);flex:none}
.oshicap .t{flex:1;min-width:0}
.oshicap .pcc{opacity:.75;white-space:nowrap}
.oshicap .capmin{flex:none;align-self:flex-start;background:transparent;border:1px solid currentColor;color:inherit;border-radius:8px;font:inherit;font-size:14px;padding:2px 10px;cursor:pointer;opacity:.85}
.oshicap.min .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oshicap.min .pcc{display:none}
/* phones: Oshi's words take a small strip at the bottom, never the screen; scroll inside it, or shrink it to one line */
@media (max-width:640px){
  .oshicap{font-size:15px;line-height:1.4;max-height:26vh;overflow-y:auto;flex-wrap:wrap;gap:4px 8px;padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
  .oshicap .t{flex:1 1 60%}
  .oshicap .pcc{order:3;width:100%;font-size:12px}
}
@keyframes lhp{0%{transform:scale(1)}35%{transform:scale(1.6);opacity:1;background:var(--lhLive);box-shadow:0 0 0 4px var(--lhWorkGlow),0 0 18px var(--lhWork)}100%{transform:scale(1)}}
.lh .dot.pulse{animation:lhp .7s ease-out}
.lh .dot.new{animation:lhp 1.4s ease-out 2}
@media (prefers-reduced-motion:reduce){.lh .dot.pulse,.lh .dot.new{animation:none;outline:2px solid var(--zircon)}}
.lh .live{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--bad)}
.lh .live::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--bad)}
.lh .feed{margin:10px 0 0;padding:0;list-style:none;font-size:14px;max-height:9.5em;overflow:auto}
.lh .feed li{padding:3px 0;border-bottom:1px solid var(--line)}
.owlist{list-style:none;margin:0;padding:0 16px 14px;max-height:20em;overflow-y:auto;overflow-x:hidden;font-size:14px;line-height:1.5}
.owlist li{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:8px 0;border-bottom:1px solid var(--line);min-width:0}
.owlist li .m{white-space:nowrap;color:var(--muted);font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px}
.owlist li .t{min-width:0;overflow-wrap:anywhere}
.owlist li.note{display:block}
@media (max-width:640px){.owlist li{grid-template-columns:1fr}}
.lh .card{margin-top:14px;border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--panel2)}
.lh .card h3{margin:0 0 6px;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.plain{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:12px 16px;margin:14px 0 10px;padding:18px;border:1px solid var(--line);border-radius:12px;font-size:17px;line-height:1.45}
.plain .pk{color:var(--muted);font-weight:600}
.plain .pv{min-width:0}
@media (max-width:520px){.plain{grid-template-columns:1fr;gap:2px}.plain .pv{margin-bottom:10px}}
.plainrel{margin:0 0 12px;font-size:15px}
details.proof{margin-top:14px}
details.proof>summary{cursor:pointer;font-weight:600;padding:10px 0;font-size:16px}
.kv{display:grid;grid-template-columns:160px 1fr;gap:6px 12px;padding:14px 16px}
.kv div:nth-child(odd){color:var(--muted);font-weight:600;font-size:13px}
.kv div{min-width:0;word-break:break-word}
pre.json{margin:0;padding:14px 16px;overflow:auto;max-height:420px;font-size:12px}
/* forms */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;padding:16px}
.form label{display:grid;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted)}
.form input,.form select{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 10px;color:var(--text)}
.reveal{margin:0 16px 16px;border:1px solid var(--warn);background:var(--warnSoft);border-radius:10px;padding:12px 14px;display:grid;gap:8px}
.reveal code{word-break:break-all;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px}
.note{font-size:12.5px;color:var(--muted)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:600;z-index:30}
/* sign in */
.signin{max-width:440px;margin:8vh auto;padding:0 16px}
.signin .panel{padding:24px}
.signin img.lock{width:100%;max-width:300px;display:block;margin:0 auto 18px;background:#fff;border-radius:12px;padding:10px 14px}
.signin input{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:10px 12px;margin:8px 0 12px}
.signin ul{padding-left:18px;color:var(--muted);font-size:13px}
footer{color:var(--faint);font-size:12px;padding:16px 0 0}
@media (max-width:1320px){.top .product,.top .sep{display:none}}
@media (max-width:1440px){.top > .pill{display:none}}
@media (max-width:1180px){.top{flex-wrap:wrap;row-gap:8px} .top .spacer{flex-basis:100%;height:0}}
/* phones and tablets: the menu stays on the left, the header shrinks to one compact row */
.navbtn{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:168px 1fr} nav{padding:10px 6px} nav button{padding:8px 10px;font-size:13.5px}
  .top{gap:8px;padding:6px max(12px,env(safe-area-inset-right)) 6px max(12px,env(safe-area-inset-left));flex-wrap:nowrap;row-gap:0} .top .spacer{flex:1;flex-basis:auto;height:auto}
  .brand img{width:30px;height:30px} .brand .name{font-size:15px} .product,.sep,.brand .tag{display:none}
  .top .btn{padding:6px 9px;font-size:12.5px} .btn.revoke-all{font-size:11px;padding:6px 8px} select.cust{max-width:150px;padding:5px 6px;font-size:13px}
  .oshiv button{padding:5px 8px;font-size:12px} .theme button{padding:4px 7px;font-size:11px}
  .decide{grid-template-columns:1fr}
  /* phones: each fact on one row, a short label beside its value, so a card reads like a list instead of a column of gaps */
  .kv{grid-template-columns:88px minmax(0,1fr);gap:7px 10px;padding:10px 0}
  .kv div:nth-child(odd){font-size:12.5px;padding-top:1px}
  .lh .card{padding:12px} .lh .kv{font-size:15px;line-height:1.35}
  .lh .feed{font-size:15px;line-height:1.4;max-height:15em}
  .lh .feed li{padding:7px 0}
  .form{grid-template-columns:minmax(0,1fr)} .form>[style*="grid-column"]{grid-column:auto!important} .form input,.form select{min-width:0;max-width:100%}
}
/* a phone held sideways is short: the header scrolls away, and REVOKE ALL AI AUTHORITY stays pinned in the corner */
@media (max-width:900px) and (max-height:520px){
  .top{position:static} .shell{min-height:0}
  .btn.revoke-all{position:fixed;right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));z-index:45;font-size:11.5px;padding:9px 12px;box-shadow:0 4px 16px rgba(0,0,0,.35)}
}
/* a phone held upright: the menu slides in from the left */
@media (max-width:640px){
  .navbtn{display:inline-flex}
  .shell{grid-template-columns:1fr}
  nav{position:fixed;left:0;top:0;bottom:0;width:min(270px,80vw);z-index:50;transform:translateX(-105%);transition:transform .2s ease;border-right:1px solid var(--line);box-shadow:4px 0 24px rgba(0,0,0,.35);padding-top:max(16px,env(safe-area-inset-top));padding-left:max(10px,env(safe-area-inset-left));overflow-y:auto}
  body.navopen nav{transform:none}
  body.navopen::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:49}
  nav button{padding:11px 12px;font-size:15px}
  .top{flex-wrap:wrap;row-gap:6px} .top .spacer{flex-basis:100%;height:0;flex:none} select.cust{max-width:100%;flex:1}
  main{padding-left:max(16px,env(safe-area-inset-left))}
}
@media (max-width:640px) and (prefers-reduced-motion:reduce){nav{transition:none}}
.pill.pass-trusted{background:var(--okSoft);color:var(--ok)} .pill.pass-watch{background:var(--warnSoft);color:var(--warn)} .pill.pass-suspended{background:var(--badSoft);color:var(--bad)}

/* THE WHY: the reason behind each decision, and Oshi's voice */
.why{border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:12px;background:var(--panel);padding:16px 18px;margin:14px 0;box-shadow:var(--shadow)}
.why .k{font:600 11px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--teal)}
.why h2{margin:6px 0 4px;font-size:19px;line-height:1.3}
.why .who{color:var(--muted);font-size:13.5px}
.why ol.path{list-style:none;margin:14px 0 6px;padding:0;display:flex;flex-direction:column}
.why ol.path li{display:grid;grid-template-columns:22px 1fr;gap:10px;position:relative;padding:0 0 12px}
.why ol.path li:not(:last-child)::before{content:"";position:absolute;left:10px;top:20px;bottom:0;width:2px;background:var(--line)}
.why ol.path .dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;border:2px solid var(--line);background:var(--panel2);color:var(--muted)}
.why ol.path .pass .dot{border-color:var(--ok);color:var(--ok);background:var(--okSoft)}
.why ol.path .stop .dot{border-color:var(--bad);color:var(--bad);background:var(--badSoft)}
.why ol.path .ok .dot{border-color:var(--teal);color:var(--teal);background:var(--tealSoft)}
.why ol.path .flag .dot{border-color:var(--warn);color:var(--warn);background:var(--warnSoft)}
.why ol.path .t{font-weight:600}.why ol.path .d{color:var(--muted);font-size:13px}
.why .seal{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);margin-top:8px;padding-top:10px}
.why .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.why .stats{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.why .stats span{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;background:var(--panel2)}
.oshiv{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.oshiv button{border:0;background:transparent;color:var(--muted);font:600 12px inherit;padding:6px 10px;cursor:pointer}
.oshiv button.on{background:var(--teal);color:var(--onTeal)}
.speaking{outline:2px solid var(--zircon);outline-offset:2px}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => n == null ? '–' : Number(n).toLocaleString();
const when = s => s ? new Date(s).toLocaleString() : '–';
const sig = n => { n = Number(n || 0); if (!n) return '0'; const a = Math.abs(n); return a >= 100 ? Math.round(n).toLocaleString() : a >= 1 ? n.toFixed(2) : n.toPrecision(2); };
const rng = (a, unit) => sig(a[0]) + ' to ' + sig(a[1]) + ' ' + unit;
const ECOS_NOTE = 'ECOS figures are declared modelled estimates from provider-measured tokens and published coefficients, not hardware meter readings. NASA and NOAA observations give place context; they did not measure these requests.';
const usd = n => n == null ? '–' : !Number(n) ? '$0.00' : '$' + (Math.abs(n) >= 0.01 ? Number(n).toFixed(2) : Number(n).toPrecision(2));
let ECOS_META = null;
async function ecosMeta(){ if (!ECOS_META) ECOS_META = await api('/ecos'); return ECOS_META; }
const store = { get(k){ try { return sessionStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k,v); } catch(e){} } };
const prefs = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };
const VERDICT_LABEL = { AGENTS_CONTAINED:'Agent contained', AGENTS_STOPPED:'All authority revoked', CERTIFIED:'Certified', NO:'Blocked', WAIT:'Held', GO:'Approved', GATE_ERROR:'Gate error', PROVIDER_ERROR:'Provider error', GATE_ERROR_PASSTHROUGH:'Passed, gate error', PROVIDER_UNREACHABLE:'Provider unreachable', PROVIDER_STREAM_ERROR:'Stream error', approved:'Approved', denied:'Denied', pending:'Waiting for review', HANDOFF:'Handoff issued', HANDOFF_REVOKED:'Handoff revoked', active:'Active', revoked:'Revoked', expired:'Expired' };
const vbadge = v => '<span class="v ' + (['CERTIFIED','GO','approved','NO','denied','PROVIDER_ERROR','GATE_ERROR','WAIT','pending','active','revoked','expired'].includes(v) ? v : 'other') + '">' + esc(VERDICT_LABEL[v] || v || '–') + '</span>';
const ACTION_LABEL = { NO:'Block', WAIT:'Hold for review', OFF:'Off' };

const VIEWS = ['dashboard','holds','receipts','rules','limits','alerts','agents','customers'];
let S = { key: store.get('gwc_key'), me: null, view: VIEWS.indexOf(location.hash.slice(1)) > 0 ? location.hash.slice(1) : 'dashboard', tenant: store.get('gwc_tenant') || '', pending: 0 };

// ---------- theme ----------
function applyTheme(t){ if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); prefs.set('gwc_theme', t || 'system'); }
applyTheme(prefs.get('gwc_theme') || 'system');
function themeToggle(){
  const t = prefs.get('gwc_theme') || 'system';
  return '<div class="theme" role="group" aria-label="Theme">' + ['light','dark','system'].map(x => '<button data-theme-set="' + x + '" class="' + (t === x ? 'on' : '') + '">' + x[0].toUpperCase() + x.slice(1) + '</button>').join('') + '</div>';
}
document.addEventListener('click', e => { const b = e.target.closest('[data-theme-set]'); if (b) { applyTheme(b.dataset.themeSet); document.querySelectorAll('[data-theme-set]').forEach(x => x.classList.toggle('on', x === b)); } });

// ---------- api ----------
async function api(path, opts){
  opts = opts || {};
  const r = await fetch('/console/api' + path, { method: opts.method || 'GET', headers: Object.assign({ 'x-console-key': S.key }, opts.body ? { 'content-type':'application/json' } : {}), body: opts.body ? JSON.stringify(opts.body) : undefined });
  let d = null; try { d = await r.json(); } catch(e) {}
  if (r.status === 401) { signOut('Your key was not accepted. Sign in again.'); throw new Error('unauthorized'); }
  if (!r.ok) throw new Error((d && d.error) || ('Request failed (' + r.status + ')'));
  return d;
}
const q = () => S.me && S.me.role === 'operator' && S.tenant ? '?tenant=' + encodeURIComponent(S.tenant) : '';
const qa = extra => { const base = q(); return base ? base + '&' + extra : '?' + extra; };
function toast(m){ const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }

// ---------- sign in ----------
function signOut(msg){ store.set('gwc_key', null); S.key = null; S.me = null; renderSignIn(msg); }
function renderSignIn(msg){
  $('#app').innerHTML = '<div class="signin"><div class="panel">' +
    '<div class="lockup" role="img" aria-label="Gov5 Gateway, AI for People and Planet, by DeBacco Nexus"><img src="/dn-mark.png" alt=""><div><div class="ln"><span class="g5">Gov5</span> Gateway</div><div class="lt">AI for People and Planet</div><div class="lb">by DeBacco Nexus</div></div></div>' +
    '<h1>Sign in to the Console</h1><p class="sub">Sign in with the key DeBacco Nexus gave you.</p>' +
    (msg ? '<p style="color:var(--bad);font-weight:600">' + esc(msg) + '</p>' : '') +
    '<form id="si"><input id="k" type="password" autocomplete="off" placeholder="Paste your key" aria-label="Key"><button class="btn primary" style="width:100%">Sign in</button></form>' +
    '<ul><li><b>Reviewer key</b> (starts with gwv_): read and decide your held requests, set your rules.</li><li><b>Gateway key</b> (gwk_): view your receipts and rules.</li><li><b>Operator key</b>: DeBacco Nexus staff.</li></ul>' +
    '<div style="display:flex;justify-content:center;margin-top:10px">' + themeToggle() + '</div></div>' +
    '<footer style="text-align:center">Governedware&trade; &middot; Patent pending, U.S. 19/571,156</footer></div>';
  $('#si').onsubmit = async e => { e.preventDefault(); const k = $('#k').value.trim(); if (!k) return; S.key = k; try { await boot(); store.set('gwc_key', k); } catch(err) { if (err.message !== 'unauthorized') renderSignIn(err.message); } };
}

// ---------- shell ----------
async function boot(){
  S.me = await api('/me');
  if (S.me.role !== 'operator') S.tenant = S.me.tenant.id;
  else if (S.tenant && !S.me.tenants.some(t => t.id === S.tenant)) S.tenant = '';
  renderShell();
  // a Oshi alert links straight to the decision: #hear-<receipt id> opens it on the Receipts page
  const hear = /^#hear-(gwr_[0-9a-f]{8,64})$/.exec(location.hash || '');
  if (hear) { go('receipts'); try { history.replaceState(null, '', '/console#receipts'); } catch(e) {} openReceipt(hear[1]).catch(e => toast(e.message)); }
  else go(S.view);
}
function renderShell(){
  const me = S.me, op = me.role === 'operator';
  const roleLabel = op ? 'DeBacco Nexus operator' : me.role === 'reviewer' ? 'Reviewer, ' + me.tenant.name : 'Developer, ' + me.tenant.name;
  const custSel = op ? '<select class="cust" id="cust" aria-label="Customer"><option value="">All customers</option>' + me.tenants.map(t => '<option value="' + esc(t.id) + '"' + (t.id === S.tenant ? ' selected' : '') + '>' + esc(t.name) + (t.revoked ? ' (revoked)' : '') + '</option>').join('') + '</select>' : '';
  const nav = [['dashboard','Dashboard'],['tryit','Try it'],['holds','Holds'],['receipts','Receipts'],['rules','Rules'],['limits','Limits'],['alerts','Alerts'],['agents','Agents']].concat(op ? [['customers','Customers']] : []);
  $('#app').innerHTML =
    '<header class="top"><button class="btn navbtn" id="navBtn" aria-label="Open the menu" aria-expanded="false">&#9776; Menu</button><a class="brand" href="/console"><img src="/dn-mark.png" alt=""><div><div class="name"><span class="g5">Gov5</span> Gateway</div><div class="tag by">by DeBacco Nexus</div></div></a>' +
    '<div class="sep"></div><div class="product">Console</div><div class="spacer"></div>' + custSel +
    '<span class="pill">' + esc(roleLabel) + '</span>' + (me.role !== 'customer' ? '<button class="btn bad revoke-all" id="hdrRevoke" title="Every agent for the chosen customer loses its authority">REVOKE ALL AI AUTHORITY</button>' : '') + oshiToggle() + themeToggle() + '<button class="btn" id="so">Sign out</button></header>' +
    '<div class="shell"><nav><div class="lbl">Console</div>' + nav.map(n => '<button data-go="' + n[0] + '">' + n[1] + (n[0] === 'holds' ? '<span class="count" id="hc" hidden></span>' : '') + '</button>').join('') + '</nav><main id="main"></main></div>';
  $('#so').onclick = () => signOut();
  bindOshiToggle();
  // the emergency control lives in the header, two steps: arm, then confirm within 8 seconds
  const hr = $('#hdrRevoke');
  if (hr) hr.onclick = async () => {
    if (!S.tenant && S.me.role === 'operator') return toast('Choose a customer at the top first.');
    if (!hr.dataset.armed) { hr.dataset.armed = '1'; hr.textContent = 'Confirm enterprise containment'; hr.classList.add('armed'); clearTimeout(hr._t); hr._t = setTimeout(() => { delete hr.dataset.armed; hr.textContent = 'REVOKE ALL AI AUTHORITY'; hr.classList.remove('armed'); }, 8000); return; }
    clearTimeout(hr._t); delete hr.dataset.armed; hr.disabled = true; hr.textContent = 'Revoking\u2026';
    try {
      const r = await api('/agents/stop-all', { method: 'POST', body: { tenant: S.tenant, by: S.me.role === 'reviewer' ? (S.me.tenant.name + ' reviewer') : undefined } });
      toast(r.stopped + (r.stopped === 1 ? ' agent' : ' agents') + ' lost authority. ' + (r.frozen || 0) + ' pending actions frozen.');
      if (S.view === 'agents') await agents(); if (r.receiptId) openReceipt(r.receiptId);
    } catch(e) { toast(e.message); }
    finally { hr.disabled = false; hr.textContent = 'REVOKE ALL AI AUTHORITY'; hr.classList.remove('armed'); }
  };
  if ($('#cust')) $('#cust').onchange = e => { S.tenant = e.target.value; store.set('gwc_tenant', S.tenant); go(S.view); };
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { document.body.classList.remove('navopen'); go(b.dataset.go); });
  // phone held upright: the menu slides in from the left; tap outside it or pick a page to close it
  const nb = $('#navBtn'); if (nb) nb.onclick = () => { const o = document.body.classList.toggle('navopen'); nb.setAttribute('aria-expanded', o); };
  document.addEventListener('click', e => { if (document.body.classList.contains('navopen') && !e.target.closest('nav') && !e.target.closest('#navBtn')) document.body.classList.remove('navopen'); });
}
function go(v){
  S.view = v; document.querySelectorAll('[data-go]').forEach(b => b.classList.toggle('on', b.dataset.go === v));
  $('#main').innerHTML = '<p class="sub">Loading…</p>';
  ({ dashboard, tryit, holds, receipts, rules, limits, alerts, agents, customers })[v]().catch(e => { if (e.message !== 'unauthorized') $('#main').innerHTML = '<div class="panel"><div class="empty">' + esc(e.message) + '</div></div>'; });
  refreshHoldCount();
}
async function refreshHoldCount(){ try { const d = await api('/holds' + q()); const n = d.holds.filter(h => h.status === 'pending').length; const el = $('#hc'); if (el) { el.textContent = n; el.hidden = !n; } } catch(e) {} }
const custName = () => { if (S.me.role !== 'operator') return S.me.tenant.name; const t = S.me.tenants.find(x => x.id === S.tenant); return t ? t.name : 'All customers'; };
const footer = '<footer>Every request through the gateway is checked before it reaches the model and recorded in a signed receipt. Governedware&trade; &middot; Patent pending, U.S. 19/571,156</footer>';

function receiptTable(rows, showCust){
  if (!rows.length) return '<div class="empty">No receipts yet.</div>';
  return '<div class="tbl"><table><thead><tr><th>Time</th>' + (showCust ? '<th>Customer</th>' : '') + '<th>Verdict</th><th>Model</th><th>Checks matched</th><th>Tokens in / out</th><th>Gate ms</th><th>Receipt</th></tr></thead><tbody>' +
    rows.map(r => '<tr class="click" data-rcpt="' + esc(r.id) + '"><td>' + when(r.at) + '</td>' + (showCust ? '<td>' + esc(r.tenantName) + '</td>' : '') + '<td>' + vbadge(r.verdict) + '</td><td>' + esc(r.model || '–') + '</td><td>' +
      (r.checksFailed.length ? r.checksFailed.map(c => '<span class="chip">' + esc(c) + '</span>').join('') : '<span class="note">none</span>') + '</td><td>' + fmt(r.tokensInput) + ' / ' + fmt(r.tokensOutput) + '</td><td>' + (r.gateMs == null ? '–' : r.gateMs) + '</td><td class="mono">' + esc(r.id.slice(0, 14)) + '…</td></tr>').join('') +
    '</tbody></table></div>';
}
function bindReceiptRows(){ document.querySelectorAll('[data-rcpt]').forEach(tr => tr.onclick = () => openReceipt(tr.dataset.rcpt)); }

// ---------- dashboard ----------
async function dashboard(){
  const d = await api('/summary' + q());
  const sp = d.spend, spOn = sp && (sp.dailyUsd || sp.monthlyUsd);
  $('#main').innerHTML = '<h1>Dashboard</h1><p class="sub">' + esc(custName()) + '. Counts come from the signed receipts the gateway issued.</p>' +
    (spOn && sp.alert ? '<div class="alert' + (sp.over ? ' bad' : '') + '">' + (sp.over ? 'Spending cap reached. New requests are ' + 'held or refused until the cap resets or is raised.' : 'Spending alert: ' + sp.topPct + '% of the cap is used.') + ' See Limits.</div>' : '') +
    savingsPanel(d.savings) + peoplePanel(d.people) +
    '<div class="cards">' +
      (spOn ? '<div class="card ' + (sp.over ? 'bad' : sp.alert ? 'warn' : 'ok') + '"><div class="n">' + (sp.dailyUsd ? usd(sp.dayUsd) : usd(sp.monthUsd)) + '</div><div class="k">' + (sp.dailyUsd ? 'Spent today of ' + usd(sp.dailyUsd) + ' cap' : 'Spent this month of ' + usd(sp.monthlyUsd) + ' cap') + '</div></div>' : '') +
      '<div class="card teal"><div class="n">' + fmt(d.total) + '</div><div class="k">AI requests receipted' + (d.events ? '<br><span class="note">plus ' + fmt(d.events) + ' governance events (agents issued, revoked, contained)</span>' : '') + '</div></div>' +
      '<div class="card ok"><div class="n">' + fmt(d.certified) + '</div><div class="k">Certified and forwarded' + (d.demoAnswered ? '<br><span class="note">' + fmt(d.demoAnswered) + ' answered by the demo stand-in; no AI model was called</span>' : '') + '</div></div>' +
      '<div class="card bad"><div class="n">' + fmt(d.blocked) + '</div><div class="k">Blocked before the model</div></div>' +
      '<div class="card warn"><div class="n">' + fmt(d.held) + '</div><div class="k">Held for review</div></div>' +
      '<div class="card warn"><div class="n">' + fmt(d.pendingHolds) + '</div><div class="k">Waiting for a reviewer now</div></div>' +
      '<div class="card"><div class="n">' + (d.medianGateMs == null ? '–' : d.medianGateMs + ' ms') + '</div><div class="k">Median gate time</div></div>' +
      '<div class="card"><div class="n">' + fmt(d.tokensInput) + '</div><div class="k">Provider input tokens (measured)</div></div>' +
      '<div class="card"><div class="n">' + fmt(d.tokensOutput) + '</div><div class="k">Provider output tokens (measured)</div></div>' +
    '</div>' +
    '<div class="panel"><h2>ECOS: Environmental Certification &amp; Oversight Standard</h2><div class="cards" style="padding:14px 16px 0;margin-bottom:0">' +
      '<div class="card ok"><div class="n" style="font-size:22px">' + sig(d.ecos.energyJ) + ' J</div><div class="k">Energy (' + sig(d.ecos.energyJ / 3600) + ' Wh)</div></div>' +
      '<div class="card ok"><div class="n" style="font-size:22px">' + sig(d.ecos.co2g) + ' g</div><div class="k">CO&#8322;e</div></div>' +
      '<div class="card ok"><div class="n" style="font-size:22px">' + sig(d.ecos.waterMl) + ' mL</div><div class="k">Water (direct and power generation)</div></div>' +
      '<div class="card ok"><div class="n" style="font-size:22px">' + usd(d.ecos.humanUsd) + '</div><div class="k">Human cost of the carbon (EPA $190/t)</div></div>' +
      '<div class="card"><div class="n" style="font-size:22px">' + usd(d.ecos.listPriceUsd) + '</div><div class="k">Model cost at list price (reference)</div></div>' +
      '<div class="card"><div class="n" style="font-size:22px">' + fmt(d.ecos.noModelRequests) + ' at 0 J</div><div class="k">Stopped before any model ran</div></div>' +

function plainWho(label){
  const l = String(label || ''); let m;
  if ((m = /^Agent (.+?) acting for (.+?) under handoff/.exec(l))) return 'AI agent "' + m[1] + '", working for ' + m[2];
  if ((m = /^Agent (.+?) acting for (.+)$/.exec(l))) return 'AI agent "' + m[1] + '", working for ' + m[2];
  if ((m = /^Tenant (.+?) \(gateway API key verified\)/.exec(l))) return 'An AI agent using ' + m[1] + '\'s gateway key (verified)';
  if ((m = /^Tenant (.+)$/.exec(l))) return 'An AI agent using ' + m[1] + '\'s gateway key';
  return l || '–';
}

  c.innerHTML = '<b>Oshi</b><span class="t">' + esc(t) + '</span>' + (pcc ? '<span class="mono pcc">sealed in PCC #' + fmt(pcc.seq) + '</span>' : '') + '<button class="capmin" type="button" aria-label="' + (mini ? 'Show all of Oshi\'s words' : 'Make Oshi\'s words one line') + '">' + (mini ? 'More' : 'Less') + '</button>';

  try {
    const d = await api('/why/voice', { method: 'POST', body: Object.assign({ tenant: S.tenant }, body) });
    if (!d.audio) throw new Error(d.error || 'Oshi could not speak just now.');
    const raw = atob(d.audio), arr = new Uint8Array(raw.length); for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
    const buf = await OSHI.ctx.decodeAudioData(arr.buffer);

      try { let rid = null; for (const h of a.holds) { const r = await api('/holds/' + encodeURIComponent(h.id) + '/decide', { method: 'POST', body: { decision: bt.dataset.dec, approver: nm, reason: (ok ? 'Approved' : 'Denied') + ' from the Lighthouse after reading the agent\'s record.' } }); rid = r.receiptId; }
        toast(a.name + (ok ? ': approved.' : ': denied.') + ' Signed receipt written.'); if (LHL.on) liveFeed('<b>' + esc(a.name) + '</b> ' + (ok ? 'approved' : 'denied') + ' by ' + esc(nm) + '. <a href="#" data-pr="' + esc(rid) + '">Decision receipt</a>');
        refreshHoldCount(); if (!LHL.on) await lighthouse(); card.innerHTML = ''; if (rid) openReceipt(rid);
      } catch(e) { toast(e.message); }
    });
    const sb = card.querySelector('[data-lhsay]'); sb.onclick = () => oshiSay({ lighthouse: true, lighthouseAgent: a.id }, card.firstChild, sb, 'Hear Oshi');
    if (OSHI.on) oshiSay({ lighthouse: true, lighthouseAgent: a.id }, card.firstChild, sb, 'Hear Oshi');
    card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

}
// ---------- agents: handoff chains ----------
async function agents(){
  const d = await api('/handoffs' + q()), all = d.handoffs, byParent = {}, pt = (await api('/patterns' + q())).findings, ps = await api('/passes' + q());
  const KIND = { 'same-request': 'Same request from many agents', 'split-payments': 'Payments split under the limit', 'fan-out': 'One agent handing work to many' }, ACT = { FLAG: 'Recorded', WAIT: 'Held for a person', NO: 'Refused' };
  all.forEach(h => { (byParent[h.parent || 'root'] = byParent[h.parent || 'root'] || []).push(h); });
  const node = h => '<li><div class="node"><div class="head">' + vbadge(h.status) + '<span class="who">' + esc(h.fromAgent) + ' &rarr; ' + esc(h.toAgent) + '</span><span class="mono note">' + esc(h.id) + '</span>' +
      (S.me.role === 'operator' && !S.tenant ? '<span class="pill">' + esc(h.tenantName) + '</span>' : '') + '</div>' +
      '<div>' + esc(h.purpose) + '</div>' +
      '<div class="note">Tools: ' + (h.allowedTools ? (h.allowedTools.length ? h.allowedTools.map(t => '<span class="chip">' + esc(t) + '</span>').join('') : 'none') : 'any') +
      ' &middot; Spent ' + usd(h.spentUsd) + (h.spendLimitUsd != null ? ' of ' + usd(h.spendLimitUsd) : '') + ' &middot; ' + fmt(h.calls) + (h.calls === 1 ? ' call' : ' calls') + ' &middot; Level ' + h.depth +
      ' &middot; ' + (h.status === 'revoked' ? 'Revoked ' + when(h.revokedAt) + ' by ' + esc(h.revokedBy) : 'Expires ' + when(h.expiresAt)) + '</div>' +
      '<div class="note">Owner: ' + (h.owner ? '<b>' + esc(h.owner) + '</b>' : '<span class="v NO">no person named</span>') + ' &middot; ' + (h.maySpawn === false ? 'May not start other agents' : h.maxChildren != null ? 'May start up to ' + fmt(h.maxChildren) + ' other agent' + (h.maxChildren === 1 ? '' : 's') : 'May start other agents') + ' &middot; Last seen ' + (h.lastSeenAt ? when(h.lastSeenAt) : 'never') + '</div>' +
      (d.canRevoke && h.status === 'active' ? '<div><button class="btn bad" data-rv="' + esc(h.id) + '">Revoke this and everything handed on from it</button></div>' : '') +
    '</div>' + ((byParent[h.id] || []).length ? '<ul class="tree">' + byParent[h.id].map(node).join('') + '</ul>' : '') + '</li>';
  const roots = all.filter(h => !h.parent || !all.some(x => x.id === h.parent));
  $('#main').innerHTML = '<h1>Agents</h1><p class="sub">Who each agent acts for, what it may do, and what it has spent. ' + esc(custName()) + '. Agents use handoff keys, never your customer key; an agent can hand on only the powers it holds.</p>' +
    '<div class="panel" id="lighthouse"><h2>Lighthouse</h2><div class="lh"><div class="note">Reading every agent&hellip;</div></div></div>' +
    '<div class="panel" id="oshiWords"><h2>What Oshi said, sealed in PCC</h2><div class="note" style="padding:10px 16px">Every line Oshi speaks is sealed in this customer\'s PCC chain, so the words can never be changed later.</div><ul class="owlist" id="owList"></ul></div>' +
    (d.canRevoke ? '<div class="panel"><h2>Revoke all AI authority</h2><p class="note" style="padding:0 16px">Every agent working for ' + esc(custName()) + ' loses its authority at once, and anything they left waiting is frozen. The containment receipt shows what stopped and what is outside coverage. On an Oshi call, say "stop all agents" after your PIN. To stop one agent and its helpers only, tap its light in the Lighthouse.</p><div class="toolbar" style="border-bottom:0">' + (S.me.role === 'reviewer' ? '<input id="saBy" placeholder="Your name">' : '') + '<button class="btn bad" id="stopAll">REVOKE ALL AI AUTHORITY</button><span id="saConfirm" hidden> Every agent stops. Are you sure? <button class="btn bad" id="saYes">Yes, revoke all</button> <button class="btn" id="saNo">No</button></span></div></div>' : '') +
    '<div class="panel"><h2>Handoff chains (' + all.length + ')</h2>' + (roots.length ? '<ul class="tree">' + roots.map(node).join('') + '</ul>' : '<div class="empty">No handoffs yet. Issue one with POST /v1/governance/handoffs using your gateway key.</div>') + '</div>' +
    '<div class="panel"><h2>Agent passes (' + ps.passes.length + ')</h2><p class="note" style="padding:0 16px">Each agent\'s track record across every job and every key. Clean calls build trust; a denied hold, a refusal or a pattern puts it on watch. A trusted agent\'s handoff can be renewed without a new key. Trust never skips a check.</p>' +
      (ps.passes.length ? '<div class="tbl"><table><thead><tr><th>Agent</th><th>Standing</th><th>Record</th><th>Last seen</th><th>Reason</th>' + (ps.canEdit ? '<th></th>' : '') + '</tr></thead><tbody>' +
        ps.passes.map(p => '<tr><td><b>' + esc(p.agent) + '</b>' + (S.me.role === 'operator' && !S.tenant ? '<div class="note">' + esc(p.tenantName) + '</div>' : '') + '</td>' +
          '<td><span class="pill pass-' + esc(p.standing) + '">' + esc({ trusted: 'Trusted', new: 'New', watch: 'On watch', suspended: 'Suspended' }[p.standing] || p.standing) + '</span><div class="note">' + esc(p.reason) + '</div></td>' +
          '<td class="note">' + fmt(p.clean) + ' clean of ' + fmt(p.calls) + (p.calls === 1 ? ' call' : ' calls') + ' &middot; ' + fmt(p.approved) + ' holds approved &middot; ' + fmt(p.denied) + ' denied &middot; ' + fmt(p.refused) + ' refused &middot; ' + fmt(p.patterns) + ' patterns &middot; ' + fmt(p.handoffs) + ' handoff keys</td>' +
          '<td>' + (p.lastSeen ? when(p.lastSeen) : '–') + '</td>' +
          '<td><button class="btn" data-whyagent="' + esc(p.agent) + '">Why</button></td>' + (ps.canEdit ? '<td>' + (p.standing === 'suspended' ? '<button class="btn" data-restore="' + esc(p.agent) + '">Restore</button>' : '<button class="btn bad" data-suspend="' + esc(p.agent) + '">Suspend pass</button>') + '</td>' : '') + '</tr>').join('') + '</tbody></table></div>' +
        (ps.canEdit ? '<div class="toolbar" style="border-top:1px solid var(--line);border-bottom:0">' + (S.me.role === 'reviewer' ? '<input id="psBy" placeholder="Your name">' : '') + '<input id="psWhy" placeholder="Reason (recorded with a suspend or restore)" style="flex:1"></div>' : '')
        : '<div class="empty">No passes yet. Each agent working under a handoff key starts one with its first call.</div>') + '</div>' +
    '<div class="panel"><h2>Agents acting together</h2><p class="note" style="padding:0 16px">Patterns no single agent would show: the same request from many agents at once, payments split to stay under a limit, one agent handing work to many. Set the thresholds on the Limits page.</p>' +
      (pt.length ? '<div class="tbl"><table><thead><tr><th>When</th><th>Pattern</th><th>What was seen</th><th>Agents</th><th>Action</th><th>Receipt</th></tr></thead><tbody>' +
        pt.map(f => '<tr><td>' + when(f.at) + '</td><td>' + esc(KIND[f.kind] || f.kind) + (f.tenantName ? '<div class="note">' + esc(f.tenantName) + '</div>' : '') + '</td><td>' + esc(f.detail || '') + '</td><td>' + fmt(f.agents || 0) + '</td><td>' + esc(ACT[f.action] || f.action || '') + '</td><td class="mono">' + (f.receiptId ? '<a href="#" data-pr="' + esc(f.receiptId) + '">' + esc(f.receiptId.slice(0, 14)) + '…</a>' : '') + '</td></tr>').join('') + '</tbody></table></div>'
        : '<div class="empty">No patterns found. Every request is read against the others as it arrives.</div>') + '</div>' + footer;
  const psAct = async (path, agent) => {
    const why = $('#psWhy') ? $('#psWhy').value.trim() : '', by = $('#psBy') ? $('#psBy').value.trim() : undefined;
    if (!why || (S.me.role === 'reviewer' && !by)) return toast('Enter ' + (S.me.role === 'reviewer' && !by ? 'your name and ' : '') + 'a reason first.');
    try { const r = await api('/passes/' + path, { method: 'POST', body: { tenant: S.tenant, agent, reason: why, by } }); toast(path === 'suspend' ? 'Pass suspended. ' + r.revoked + ' handoff' + (r.revoked === 1 ? '' : 's') + ' revoked.' : 'Pass restored. It is now ' + r.standing + '.'); agents(); } catch(e) { toast(e.message); }
  };
  document.querySelectorAll('[data-whyagent]').forEach(b => b.onclick = () => {
    let box = document.getElementById('whyAgentBox'); if (!box) { box = document.createElement('div'); box.id = 'whyAgentBox'; const m = $('#main'); m.insertBefore(box, m.children[2] || null); }
    fillWhySet({ agent: b.dataset.whyagent }, box); box.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  lighthouse.spoke = false; lighthouse(); lhSpoken();
  if ($('#stopAll')) {
    $('#stopAll').onclick = () => { $('#saConfirm').hidden = false; };
    $('#saNo').onclick = () => { $('#saConfirm').hidden = true; };
    $('#saYes').onclick = async () => {
      try { const r = await api('/agents/stop-all', { method: 'POST', body: { tenant: S.tenant, by: $('#saBy') ? $('#saBy').value.trim() : undefined } }); toast(r.stopped + (r.stopped === 1 ? ' agent' : ' agents') + ' lost authority. ' + (r.frozen || 0) + ' pending actions frozen.'); await agents(); if (r.receiptId) openReceipt(r.receiptId); }
      catch(e) { toast(e.message); }
    };
  }
  document.querySelectorAll('[data-suspend]').forEach(b => b.onclick = () => psAct('suspend', b.dataset.suspend));
  document.querySelectorAll('[data-restore]').forEach(b => b.onclick = () => psAct('restore', b.dataset.restore));
  document.querySelectorAll('a[data-pr]').forEach(a => a.onclick = e => { e.preventDefault(); openReceipt(a.dataset.pr); });
  document.querySelectorAll('[data-rv]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { const r = await api('/handoffs/' + encodeURIComponent(b.dataset.rv) + '/revoke', { method: 'POST', body: { by: S.me.role === 'reviewer' ? (S.me.tenant.name + ' reviewer') : undefined } }); toast('Revoked ' + r.revoked + ' handoff' + (r.revoked === 1 ? '' : 's') + '.'); agents(); }
    catch(e) { b.disabled = false; toast(e.message); }
  });
}

// ---------- customers (operator) ----------
async function customers(reveal){
  const d = await api('/tenants'), meta = await ecosMeta();
  S.me.tenants = d.tenants;
  $('#main').innerHTML = '<h1>Customers</h1><p class="sub">Create a customer, give them their keys once, and turn keys off. Keys are stored only as hashes, so they cannot be shown again.</p>' +
    (reveal ? '<div class="panel"><div class="reveal"><b>' + esc(reveal.title) + '</b><code class="mono" id="rk">' + esc(reveal.key) + '</code><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="cp">Copy key</button><span class="note">Shown only now. Send it through a password manager or read it over the phone, never in an email body.</span></div></div></div>' : '') +
    '<div class="panel"><h2>New customer</h2><form class="form" id="nc">' +
      '<label>Customer name<input name="name" required placeholder="Acme Health pilot"></label>' +
      '<label>Provider<select name="provider"><option value="anthropic">Anthropic</option><option value="openai">OpenAI</option></select></label>' +
      '<label>Provider API key<input name="providerKey" type="password" required autocomplete="off" placeholder="Stored encrypted, never shown"></label>' +
      '<label>ECOS region (grid)<select name="region">' + meta.regions.map(g => '<option value="' + esc(g.code) + '"' + (g.code === meta.defaultRegion ? ' selected' : '') + '>' + esc(g.name) + '</option>').join('') + '</select></label>' +
      '<label>If the gate fails<select name="failMode"><option value="closed">Refuse the request (closed)</option><option value="open">Forward and record it (open)</option></select></label>' +
      '<div style="display:flex;align-items:end"><button class="btn primary">Create customer</button></div></form></div>' +
    '<div class="panel"><h2>All customers</h2><div class="tbl"><table><thead><tr><th>Customer</th><th>Provider</th><th>ECOS region</th><th>If gate fails</th><th>Gateway key</th><th>Reviewer key</th><th>Created</th><th></th></tr></thead><tbody>' +
      (d.tenants.length ? d.tenants.map(t => '<tr><td><b>' + esc(t.name) + '</b><div class="note mono">' + esc(t.id) + '</div></td><td>' + esc(t.provider) + '</td><td>' + (t.revoked ? esc(t.regionName) : '<select data-region="' + esc(t.id) + '">' + meta.regions.map(g => '<option value="' + esc(g.code) + '"' + (g.code === t.region ? ' selected' : '') + '>' + esc(g.name) + '</option>').join('') + '</select>') + '</td><td>' + (t.failMode === 'closed' ? 'Refuse' : 'Forward') + '</td><td class="mono">' + esc(t.keyPrefix) + '…</td><td class="mono">' + (t.reviewerKeyPrefix ? esc(t.reviewerKeyPrefix) + '…' : '<span class="note">none</span>') + '</td><td>' + when(t.createdAt) + '</td><td style="white-space:nowrap">' +
        (t.revoked ? '<span class="v NO">Revoked</span>' : '<button class="btn" data-rev-key="' + esc(t.id) + '">' + (t.reviewerKeyPrefix ? 'New reviewer key' : 'Issue reviewer key') + '</button> <button class="btn" data-revoke="' + esc(t.id) + '">Revoke</button>') + '</td></tr>').join('') : '<tr><td colspan="8" class="empty">No customers yet.</td></tr>') +
    '</tbody></table></div></div>' + footer;
  if ($('#cp')) $('#cp').onclick = async () => { try { await navigator.clipboard.writeText(reveal.key); toast('Copied.'); } catch(e) { const r = document.createRange(); r.selectNodeContents($('#rk')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Selected. Press Cmd+C to copy.'); } };
  $('#nc').onsubmit = async e => {
    e.preventDefault(); const f = new FormData(e.target), body = Object.fromEntries(f.entries());
    try { const r = await api('/tenants', { method: 'POST', body }); customers({ title: 'Gateway key for ' + r.tenant.name, key: r.apiKey }); } catch(err) { toast(err.message); }
  };
  document.querySelectorAll('[data-rev-key]').forEach(b => b.onclick = async () => {
    const t = d.tenants.find(x => x.id === b.dataset.revKey);
    if (t.reviewerKeyPrefix && b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'Replace the old key?'; return; }
    try { const r = await api('/tenants/' + encodeURIComponent(t.id) + '/reviewer-key', { method: 'POST' }); customers({ title: 'Reviewer key for ' + t.name, key: r.reviewerKey }); } catch(e) { toast(e.message); }
  });
  document.querySelectorAll('[data-region]').forEach(sel => sel.onchange = async () => {
    try { await api('/tenants/' + encodeURIComponent(sel.dataset.region) + '/region', { method: 'PUT', body: { region: sel.value } }); toast('ECOS region saved. New receipts use it; signed receipts keep theirs.'); } catch(e) { toast(e.message); }
  });
  document.querySelectorAll('[data-revoke]').forEach(b => b.onclick = async () => {
    if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'Click again to revoke'; b.classList.add('bad'); return; }
    try { await api('/tenants/' + encodeURIComponent(b.dataset.revoke) + '/revoke', { method: 'POST' }); toast('Revoked. The next request with that key is refused.'); customers(); } catch(e) { toast(e.message); }
  });
}

if (S.key) boot().catch(e => { if (e.message !== 'unauthorized') renderSignIn(e.message); }); else renderSignIn();
})();
</script>
